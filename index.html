<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abdullah Alshammari — Data Science & AI</title>
    <meta name="description" content="Portfolio of Abdullah Alshammari — turning raw, messy data into clear answers: machine learning, analytics dashboards, and decisions." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Abdullah Alshammari — Data Science & AI" />
    <meta property="og:description" content="Machine learning, analytics dashboards, and decision-ready insights." />
    <meta property="og:url" content="https://alshammari.dev/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Theme pre-init: set before first paint to avoid a flash of wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* default stays dark */ }
      })();
      // spa-github-pages decoder: 404.html redirects /cv -> /?/cv ; restore it.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
