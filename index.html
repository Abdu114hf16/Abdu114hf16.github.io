    <script>
      // Theme pre-init: set before first paint to avoid a flash of wrong theme.
      // A stored choice wins; otherwise follow the OS. Only falls back to the
      // document's dark default when the OS states no preference.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) { /* default stays dark */ }
      })();
      // spa-github-pages decoder: 404.html redirects /cv -> /?/cv ; restore it.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
